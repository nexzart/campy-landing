<div class="grid grid-cols-1 gap-6 lg:grid-cols-[1.25fr_0.75fr]">
  <div class="space-y-4">
    <template x-for="(sec, s) in sections" :key="s">
      <div class="panel">
        <div class="flex items-center justify-between gap-4">
          <h2 class="panel-title" x-text="sec.title"></h2>
          <span class="tag" :class="sectionScore(s) === 100 ? 'tag-ok' : 'tag-mid'" x-text="$fmt(sectionScore(s), 0) + '%'"></span>
        </div>
        <ul class="mt-3 divide-y divide-primary/[0.07]">
          <template x-for="(item, i) in sec.items" :key="i">
            <li>
              <label class="flex cursor-pointer items-start gap-3 py-2.5">
                <input type="checkbox" class="mt-1 h-4 w-4 shrink-0" x-model="done[id(s, i)]">
                <span class="flex-1 text-[0.9375rem]" x-text="item[0]"></span>
                <span x-show="item[1] === 3" class="tag tag-mid shrink-0">Critical</span>
              </label>
            </li>
          </template>
        </ul>
      </div>
    </template>
  </div>

  <div class="lg:sticky lg:top-24 lg:self-start">
    <div id="checklist-report" class="panel">
      <div class="stat stat-main">
        <p class="stat-label">Readiness score</p>
        <p class="stat-value text-4xl" x-text="$fmt(score, 0) + '%'"></p>
        <p class="mt-1 font-semibold text-secondary" x-text="level"></p>
      </div>
      <div class="mt-4 space-y-2.5">
        <template x-for="(sec, s) in sections" :key="s">
          <div class="text-sm">
            <div class="flex justify-between"><span x-text="sec.title"></span><span class="tabular-nums" x-text="$fmt(sectionScore(s), 0) + '%'"></span></div>
            <div class="bar mt-1"><span :style="'width:' + sectionScore(s) + '%'"></span></div>
          </div>
        </template>
      </div>
      <div class="mt-6" x-show="gaps.length">
        <p class="font-semibold">Still to do, most important first</p>
        <ol class="mt-2 list-decimal space-y-1.5 pl-5 text-sm text-primary/80">
          <template x-for="(g, i) in gaps.slice(0, 8)" :key="i"><li x-text="g.text"></li></template>
        </ol>
        <p class="hint mt-2" x-show="gaps.length > 8" x-text="'and ' + (gaps.length - 8) + ' more'"></p>
      </div>
    </div>
    <div class="mt-3 flex flex-wrap gap-2">
      <button type="button" class="btn btn-primary btn-sm" @click="$print('#checklist-report')"><i data-lucide="printer" class="h-4 w-4"></i>Print summary</button>
      <button type="button" class="btn btn-outline btn-sm" @click="all(false)">Clear all</button>
    </div>
    <p class="hint mt-3">If you allow preference cookies, your ticks are remembered in this browser so you can come back and continue.</p>
  </div>
</div>
